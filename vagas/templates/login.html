<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema de Acolhimento</title>
</head>
<body>

    <div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc;">
        <h2>Entrar no Sistema</h2>

        {% if form.errors %}
            <p style="color: red;">Usuário ou senha incorretos. Tente novamente.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            {{ form.as_p }}

            <button type="submit">Entrar</button>
        </form>
    </div>

</body>
</html>
